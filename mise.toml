# granary tasks (ADR 0020). Dev/test env defaults live in config/dev.env and
# are attached per task, so `prod` never sees fake values.

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "SvelteKit dev server on Bun (http://localhost:5173)"
env = { _.file = "config/dev.env" }
run = "bun --bun vite dev --port 5173 --strictPort"

[tasks.fake-github]
description = "Fake GitHub server (http://localhost:4010)"
env = { _.file = "config/dev.env" }
run = "bun --hot fake-github/server.ts"

[tasks.loadgen]
description = "Load generator / persona simulator (http://localhost:4040), ADR 0070"
env = { _.file = "config/dev.env" }
run = "bun --hot loadgen/server.ts"

[tasks.fake-infra]
description = "Fake R2 / OTLP receiver / exe.dev proxy (http://localhost:4090), ADR 0130"
env = { _.file = "config/dev.env" }
run = "bun --hot fake-infra/server.ts"

[tasks."load:run"]
description = "Headless load scenario against the running dev stack; exit 1 on invariant violations (e.g. -- --preset chaos --seed 7)"
env = { _.file = "config/dev.env" }
run = "bun loadgen/cli.ts"

[tasks.up]
description = "Start dev daemons via pitchfork (fake GitHub + app + loadgen + fake-infra); see pitchfork.toml"
run = [
  "pitchfork stop granary/app-real || true",
  "pitchfork start granary/fake-github granary/loadgen granary/fake-infra granary/app",
]

[tasks."infra:rustfs"]
description = "RustFS (S3-compatible) in docker: S3 :9000, console :9001/rustfs/console/ (real local stack, ADR 0027)"
run = "tools/dev/container.sh granary-rustfs -p 9000:9000 -p 9001:9001 -e RUSTFS_ACCESS_KEY=granary-dev -e RUSTFS_SECRET_KEY=granary-dev-secret -e RUSTFS_CONSOLE_ENABLE=true -v granary-rustfs:/data rustfs/rustfs:latest"

[tasks."infra:grafana"]
description = "Grafana LGTM in docker: UI :3300, OTLP gRPC :4317 / HTTP :4318 (real local stack, ADR 0027)"
run = "tools/dev/container.sh granary-lgtm -p 3300:3000 -p 4317:4317 -p 4318:4318 -v granary-lgtm:/data grafana/otel-lgtm:latest"

[tasks."dev:real"]
description = "Dev server wired to the real local stack (RustFS + Grafana) instead of fake-infra sinks"
env = { _.file = ["config/dev.env", "config/real.env"] }
run = ["bun tools/dev/s3-create-bucket.ts", "bun --bun vite dev --port 5173 --strictPort"]

[tasks."up:real"]
description = "Like `up`, but the app uses real RustFS + Grafana (stops granary/app, starts granary/app-real)"
run = [
  "pitchfork stop granary/app || true",
  "pitchfork start granary/fake-github granary/loadgen granary/fake-infra granary/rustfs granary/grafana granary/app-real",
]

[tasks."down:real"]
description = "Stop the real local stack (app-real, RustFS, Grafana) and the shared dev daemons"
run = "pitchfork stop granary/app-real granary/rustfs granary/grafana granary/loadgen granary/fake-github granary/fake-infra"

[tasks.down]
description = "Stop dev daemons started from pitchfork.toml"
run = "pitchfork stop granary/app granary/loadgen granary/fake-github granary/fake-infra"

[tasks.logs]
description = "Tail logs of the dev daemons"
run = "pitchfork logs -t granary/app granary/fake-github granary/loadgen granary/fake-infra"

[tasks."logs:real"]
description = "Tail logs of the real local stack"
run = "pitchfork logs -t granary/app-real granary/rustfs granary/grafana"

[tasks.cli]
description = "Build the granary CLI into dist/cli.js (ADR 0159)"
run = "bun build src/cli/main.ts --target bun --external @tinyactors/node --outfile dist/cli.js"

[tasks.build]
description = "Production build (svelte-adapter-bun) into build/"
run = "bun --bun vite build"

[tasks.start]
description = "Run the built app with dev env (fake GitHub)"
env = { _.file = "config/dev.env", ORIGIN = "http://localhost:3000" }
run = "bun build/index.js"

[tasks."docs:cli"]
description = "Generate docs/manual/cli.md from the CLI catalogue (ADR 0165)"
run = "bun tools/docs/cli.ts"

[tasks."brand:render"]
description = "Regenerate the wheat logo, favicons and app icons in static/ (ADR 0270)"
run = "bun tools/brand/render.ts"

[tasks."brand:preview-github"]
description = "GitHub App logo as GitHub crops it (circle on light/dark, 200 to 20 px): mise run brand:preview-github -- <out.png>"
run = "bun tools/brand/preview-github.ts ."

[tasks."brand:preview"]
description = "Contact sheet of the brand assets (tile, mark on light/dark, 16/32 px favicon): mise run brand:preview -- <out.png>"
run = "bun tools/brand/preview.ts ."

[tasks.check]
description = "Type-check (svelte-kit sync + svelte-check)"
run = ["bunx svelte-kit sync", "bunx svelte-check --tsconfig ./tsconfig.json --output human"]

[tasks."ops:restore"]
description = "Restore an ops backup to a file and verify it (ADR 0116). Needs GRANARY_MASTER_KEY: `fnox exec -P prod -- mise run ops:restore -- --ops-db data/ops.sqlite --dest seed-r2 --latest --out restored.sqlite`"
run = "bun src/lib/ops/cli/restore.ts"

[tasks."check:boundaries"]
description = "Module boundary rules: granary ↔ ops ↔ fake-infra (ADR 0080, 0109)"
run = ["ast-grep scan", "tools/check-svelte-boundaries.sh"]

[tasks.test]
description = "Integration tests against the built app and CLI (ADR 0007)"
depends = ["build", "cli"]
run = "bun test --parallel=4 ./tests/"

[tasks.prod]
description = "Run the built app with production secrets from fnox"
run = "fnox exec -P prod -- bun build/index.js"

[tools]
pitchfork = "latest"
"npm:agent-browser" = "latest"  # interactive browser verification (ADR 0024)

[tasks.deploy]
description = "Deploy to a host installed per docs/manual/install.md: pack HEAD (or --tarball/--npm), install, restart, verify (ADR 0233)"
run = "bun tools/deploy/deploy.ts"

[tasks."release:pack"]
description = "Build the publishable npm package from a clean git export → release/*.tgz (ADR 0180)"
run = "bun tools/release/pack.ts"

[tasks."release:verify"]
description = "Install the packed tarball on clean oven/bun Linux containers (arm64 + amd64) and exercise it (ADR 0181)"
run = "bun tools/release/verify.ts"

[tasks."release:publish"]
description = "Publish the verified tarball to npm (dry run unless -- --yes; --channel dev|latest; ADR 0182/0185)"
run = "bun tools/release/publish.ts"

[tasks.release]
description = "Release in one go: pack → verify → publish for -- --channel dev|latest (dry run unless --yes; ADR 0186)"
run = "bun tools/release/release.ts"

[tasks."release:promote"]
description = "Point the npm `latest` dist-tag at an existing stable version (-- <version> --yes; ADR 0188)"
run = "fnox exec -P release -- bun tools/release/promote.ts"

