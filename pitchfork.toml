# Long-lived dev processes are pitchfork daemons wrapping mise tasks (ADR 0026).
# Start: `mise run up` (or `mise run up:real`), stop: `pitchfork stop <id>`.

[daemons.fake-github]
run = "mise run fake-github"
ready_port = 4010

[daemons.app]
run = "mise run dev"
# vite binds [::1] only, so a TCP port probe never sees it; poll HTTP instead
ready_http = "http://localhost:5173/"
depends = ["fake-github"]

[daemons.loadgen]
run = "mise run loadgen"
ready_port = 4040
depends = ["fake-github"]

[daemons.fake-infra]
run = "mise run fake-infra"
ready_port = 4090

# --- real local stack (ADR 0027): `mise run up:real` -------------------------
# app and app-real share port 5173; the up / up:real tasks stop one before
# starting the other. Don't use `pitchfork start -l` (it would start both).

[daemons.rustfs]
run = "mise run infra:rustfs"
ready_port = 9000

[daemons.grafana]
run = "mise run infra:grafana"
ready_http = "http://localhost:3300/api/health"

[daemons.app-real]
run = "mise run dev:real"
ready_http = "http://localhost:5173/"
depends = ["fake-github", "fake-infra", "rustfs", "grafana"]
