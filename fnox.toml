# Production secrets for granary (ADR 0157, 0230): only the master key; the
# GitHub App's credentials are created in-product and stored encrypted under
# it. These are 1Password *references* (item/field in the Personal vault via
# the global `1password` provider), never values. Create the 1Password item
# "granary" with these fields before running `mise run prod`.
# Dev uses fake values from config/dev.env instead.
#
# They live in the `prod` profile (not the default one) so that shell
# activation (`fnox activate`) does not try to resolve them on every `cd`
# into the project (ADR 0025). Use: `fnox exec -P prod -- …` / `mise run prod`.

[profiles.prod.secrets]
GRANARY_MASTER_KEY = { provider = "1password", value = "granary/master-key", description = "Master key (32 bytes, base64 or hex) wrapping all stored secrets and backup keys (ADR 0086, 0157)" }
GRANARY_MASTER_KEY_PREVIOUS = { provider = "1password", value = "granary/master-key-previous", description = "Previous master key during rotation only; remove once rewrapped (ADR 0086)", if_missing = "ignore" }

# Release credentials (ADR 0182): a separate profile so the publish token is
# never injected into the running server (`prod`). Used by
# `mise run release:publish`. Create an npm *granular* automation token with
# publish rights on @tinyactors/granary only, store it in 1Password item
# "granary" field "npm-token".
[profiles.release.secrets]
NPM_TOKEN = { provider = "1password", value = "granary/npm-token", description = "npm granular token: publish @tinyactors/granary (ADR 0182)", if_missing = "ignore" }
