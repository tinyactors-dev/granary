# Release (ADR 0186, 0301): every push to main runs the tests and publishes the
# rolling dev build (`<next patch>-dev.<epoch>.g<sha>`, dist-tag `dev`), which
# hosts pick up with `granary update`; a manual run releases either channel.
# One workflow file for both, because npm's trusted publisher names the
# workflow that runs (a reusable workflow's caller would not match). Every step
# delegates to the single release script, tools/release/release.ts — the same
# one used on a laptop.
#
#   test      → mise run test against the built app (gates every release)
#
#   pack      → one tarball, uploaded as an artifact
#   verify    → installs that tarball natively on x86-64 and arm64 runners
#   edge      → (dev only) the tarball and SHA256SUMS as the rolling GitHub
#               prerelease `edge`, the fast lane for hosts (ADR 0302)
#   publish   → npm publish --provenance under the channel's dist-tag
#               (dry run unless dry_run is false)
#
# npm credentials: npm trusted publishing (OIDC) for this repository and
# workflow, configured on npmjs.com — no long-lived token. The repository
# secret NPM_TOKEN is used instead when it is set.
name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "npm dist-tag / channel (dev: <x.y.z>-dev.<epoch>.g<sha>; latest: needs tag v<version> + dated CHANGELOG)"
        type: choice
        options: [dev, latest]
        default: dev
      dry_run:
        description: "Dry run (pack + verify + npm publish --dry-run)"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # A push releases the dev channel for real; a manual run uses its inputs.
  CHANNEL: ${{ github.event_name == 'push' && 'dev' || inputs.channel }}
  DRY_RUN: ${{ github.event_name == 'push' && 'false' || format('{0}', inputs.dry_run) }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_YES: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false" # the tasks need only bun; skip pitchfork and agent-browser

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: bun install --frozen-lockfile
      - run: mise run test

  pack:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: bun tools/release/release.ts pack --channel "$CHANNEL"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            release/*.tgz
            release/meta.json
          if-no-files-found: error

  verify:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: release
      - run: bun tools/release/release.ts verify --platform "${{ matrix.platform }}" --out "release/verify-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-${{ matrix.arch }}
          path: release/verify-${{ matrix.arch }}.json

  edge:
    # The fast lane (ADR 0302): every dev release also replaces the rolling
    # GitHub prerelease `edge` with the verified tarball and its SHA256SUMS.
    # Hosts on `granary update --channel edge` install it within a minute,
    # without waiting for npm's review of the new version.
    needs: verify
    if: github.event_name == 'push' || (inputs.channel == 'dev' && !inputs.dry_run)
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the edge release and its tag
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: release
      - name: replace the edge release
        run: |
          cd release
          tgz=$(ls tinyactors-granary-*.tgz)
          version=${tgz#tinyactors-granary-}; version=${version%.tgz}
          sha256sum "$tgz" > SHA256SUMS
          gh release delete edge --cleanup-tag --yes || true
          gh release create edge "$tgz" SHA256SUMS --prerelease --target "$GITHUB_SHA" \
            --title "edge: $version" \
            --notes "The newest build of main ($GITHUB_SHA), replaced on every push. Hosts follow it with \`granary update --channel edge\` (ADR 0302)."

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm provenance + trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the latest channel's v<version> check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >= 11.5 for trusted publishing and provenance
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          args=(publish --channel "$CHANNEL" --provenance)
          if [ "$DRY_RUN" = "false" ]; then args+=(--yes); fi
          bun tools/release/release.ts "${args[@]}"
