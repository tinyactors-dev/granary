# Every push to main (ADR 0301): run the test suite against the built app, then
# publish the rolling dev build (`<next patch>-dev.<epoch>.g<sha>`, npm dist-tag
# `dev`) through the release workflow. Hosts that follow the dev channel pick it
# up with `granary update` (a systemd timer), so a green push reaches them
# within minutes — nothing here holds credentials for any host.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push supersedes a waiting one: only the newest commit is released.
  group: main
  cancel-in-progress: false

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_YES: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false" # the tests need only bun; skip pitchfork and agent-browser

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: bun install --frozen-lockfile
      - run: mise run test

  release:
    needs: test
    uses: ./.github/workflows/release.yml
    with:
      channel: dev
      dry_run: false
    permissions:
      contents: read
      id-token: write # npm provenance + trusted publishing, as in release.yml
    secrets: inherit
